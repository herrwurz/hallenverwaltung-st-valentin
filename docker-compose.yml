services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hallenverwaltung}
      POSTGRES_USER: ${POSTGRES_USER:-hallenverwaltung}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hallenverwaltung}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-hallenverwaltung}?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:deploy"]
    restart: "no"

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-hallenverwaltung}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-hallenverwaltung}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-long-random-secret}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-test}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hallenverwaltung}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-hallenverwaltung}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-replace-with-a-long-random-secret}
      WORKER_INTERVAL_SECONDS: ${WORKER_INTERVAL_SECONDS:-300}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      MAIL_DELIVERY_MODE: ${MAIL_DELIVERY_MODE:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Hallenverwaltung St. Valentin}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "while true; do npm run worker:run; sleep $${WORKER_INTERVAL_SECONDS}; done"]

volumes:
  postgres_data:
